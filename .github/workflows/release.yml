name: Build & Attach APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk G-Pulse-v2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk G-Pulse-v1.0.apk

      - name: Publish & Attach APK to v2.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "G-Pulse HUD v2.0 (Latest Release)"
          files: G-Pulse-v2.0.apk
          draft: false
          prerelease: false
          body: |
            ### 📦 Direct APK Download
            Download and install the pre-compiled APK directly on your phone:
            - **[G-Pulse-v2.0.apk](https://github.com/${{ github.repository }}/releases/download/v2.0/G-Pulse-v2.0.apk)**

            *(Ignore `Source code (zip)` unless you are compiling from source).*

      - name: Publish & Attach APK to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "G-Pulse HUD v1.0"
          files: G-Pulse-v1.0.apk
          draft: false
          prerelease: false
          body: |
            ### 📦 Direct APK Download
            Download and install the pre-compiled APK directly on your phone:
            - **[G-Pulse-v1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/G-Pulse-v1.0.apk)**

            *(Ignore `Source code (zip)` unless you are compiling from source).*
